name: zhamlik_crypto
description: Zhamlik Crypto Portfolio Tracker

publish_to: 'none'

version: 1.3.1+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP Client
  http: ^1.2.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.2.0

  # File & Storage
  path_provider: ^2.1.1
  open_file: ^3.3.2
  url_launcher: ^6.2.2

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  animations: ^2.0.11
  percent_indicator: ^4.2.3
  syncfusion_flutter_charts: ^24.1.41

  # Utilities
  intl: ^0.19.0
  currency_formatter: ^2.2.0

  # Navigation
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/